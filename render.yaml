services:
  - type: web
    name: kadaju67-market-system
    runtime: php
    repo: https://github.com/kadafijunior2-beep/kadaju67-market-system.git
    branch: main
    plan: free
    healthCheckPath: /up
    buildCommand: |-
      composer install --no-dev --optimize-autoloader
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: |-
      php artisan migrate --force &&
      php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: kadaju67-market-system
          envVarKey: RENDER_EXTERNAL_URL
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_DATABASE
        fromDatabase:
          name: kadaju67-market-db
          property: database
      - key: DB_HOST
        fromDatabase:
          name: kadaju67-market-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: kadaju67-market-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: kadaju67-market-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: kadaju67-market-db
          property: password
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_LEVEL
        value: warning
      - key: LOG_CHANNEL
        value: stack
      - key: DB_SSLMODE
        value: require

databases:
  - name: kadaju67-market-db
    plan: free
    databaseName: kadaju67_market
    user: kadaju67_user
    postgresMajorVersion: 16
