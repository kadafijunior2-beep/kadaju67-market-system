[build]
  builder = "nixpacks"
  buildCommand = "composer install --no-dev --optimize-autoloader && php artisan config:cache && php artisan route:cache && php artisan view:cache"

[deploy]
  startCommand = "APP_URL=https://$RAILWAY_PUBLIC_DOMAIN php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
  healthcheckPath = "/up"
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 10
